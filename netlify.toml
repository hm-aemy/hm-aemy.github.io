# Netlify is only used for pull request previews.
# The live site is deployed to GitHub Pages by .github/workflows/deploy.yml.

[build]
  publish = "dist"
  # SITE_URL makes canonical/og links point at the preview
  command = "SITE_URL=$DEPLOY_PRIME_URL npm run build"

[build.environment]
  NODE_VERSION = "24"

# Never build main on Netlify: GitHub Pages serves the live site
[context.production]
  ignore = "exit 0"
